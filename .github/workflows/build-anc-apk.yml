name: Build Sony ANC APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossDebug --no-daemon --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earshot-Sony-ANC-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
